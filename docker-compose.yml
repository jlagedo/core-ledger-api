services:
  postgres:
    image: postgres:18
    container_name: core-ledger-db
    environment:
      POSTGRES_DB: core_ledger_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    shm_size: 128mb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  
  glitchtip:
    image: glitchtip/glitchtip
    container_name: glitchtip
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@core-ledger-db:5432/glitchtip_db
      VALKEY_URL: ""   # empty = no Redis
      SECRET_KEY: 09bc0bd1c98d956279b430beb54303f69586e0d31323d88c638ce053f77c1d79
      PORT: 8000
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://localhost:8000
      DEFAULT_FROM_EMAIL: email@example.com
      CELERY_WORKER_AUTOSCALE: "1,2"
    command: ./bin/run-all-in-one.sh
    restart: unless-stopped
    volumes:
      - uploads:/code/uploads

volumes:
  postgres_data:
  uploads:
